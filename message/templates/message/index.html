{% extends 'core/base.html' %}

{% block title %}채팅{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">공개 채팅</h2>
                    <p>참여하고 싶은 공개 채팅방의 이름을 입력하세요.</p>
                    <div class="input-group">
                        <input id="room-name-input" type="text" class="form-control" placeholder="채팅방 이름">
                        <button id="room-name-submit" class="btn btn-primary">입장</button>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">1:1 비공개 채팅</h2>
                    <p>채팅하고 싶은 사용자를 선택하세요.</p>
                    <div class="list-group">
                        {% for user in users %}
                            <a href="{% url 'create_private_chat' user.username %}" class="list-group-item list-group-item-action">
                                {{ user.username }}
                            </a>
                        {% empty %}
                            <p class="text-muted">채팅할 다른 사용자가 없습니다.</p>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.querySelector('#room-name-input').focus();
    document.querySelector('#room-name-input').onkeyup = function(e) {
        if (e.key === 'Enter') {  // enter, return
            document.querySelector('#room-name-submit').click();
        }
    };

    document.querySelector('#room-name-submit').onclick = function(e) {
        var roomName = document.querySelector('#room-name-input').value;
        if (roomName.trim() !== '') {
            window.location.pathname = '/message/' + roomName + '/';
        }
    };
</script>
{% endblock %}
