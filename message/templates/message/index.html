{% extends 'core/base_app.html' %}

{% block title %}나의 채팅방 목록{% endblock %}

{% block app_content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">나의 채팅방 목록</h2>
                </div>
                <div class="card-body">
                    {% if user_chats %}
                        <div class="list-group">
                            {% for chat in user_chats %}
                                <a href="{% url 'message:room' chat.room.name %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                    <div>
                                        <h5 class="mb-1">{{ chat.other_user.nickname }}님과의 대화</h5>
                                        <small class="text-muted">채팅방: {{ chat.room.name }}</small>
                                    </div>
                                    <span class="badge bg-primary rounded-pill">입장</span>
                                </a>
                            {% endfor %}
                        </div>
                    {% else %}
                        <p class="text-center text-muted">아직 참여중인 채팅방이 없습니다.</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
