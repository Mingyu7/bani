{% extends 'core/base_app.html' %}

{% block title %}나의 채팅방 목록{% endblock %}

{% block app_content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">나의 채팅방 목록</h2>
                </div>
                <div class="card-body">
                    {% if user_chats %}
                        <div class="list-group">
                            {% for chat in user_chats %}
                                <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                    <a href="{% url 'message:room' chat.room.name %}" class="text-decoration-none text-dark w-100">
                                        <h5 class="mb-1">{{ chat.chat_title }}</h5>
                                        <small class="text-muted">채팅방: {{ chat.room.name }}</small>
                                    </a>
                                    <form action="{% url 'message:delete_chat_room' chat.room.id %}" method="post" onsubmit="return confirm('정말로 이 채팅방을 삭제하시겠습니까?');" class="ms-3">
                                        {% csrf_token %}
                                        <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                                    </form>
                                </div>
                            {% endfor %}
                        </div>
                    {% else %}
                        <p class="text-center text-muted">아직 참여중인 채팅방이 없습니다.</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
