{% extends 'core/base_app.html' %}

{% block title %}Confirm Delete - Board{% endblock %}

{% block content %}
    <h2>Are you sure you want to delete "{{ object.title }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <p>This action cannot be undone.</p>
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'board:post_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
